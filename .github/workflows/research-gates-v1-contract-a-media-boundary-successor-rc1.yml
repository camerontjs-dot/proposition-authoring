name: Research - Gate V1 Contract A Media Boundary Successor RC1

on:
  push:
    branches:
      - fix/gate-v1-contract-a-media-boundary-rc1-20260918
  pull_request:
    branches:
      - promotion/main-converge-v1.0.0-20260917
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PREDECESSOR_SHA: c0da10e2e3b9aada5f66af9859cf27964fd3c5fc
      CONTRACT_A_SHA: 529c92b49a34d5c610618551a8737f019f9fa332
      FIXED_IDENTITY: gate-v1-media-boundary-rc1-comparison
    steps:
      - name: Checkout successor
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 1

      - name: Checkout exact V1.0.0 predecessor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREDECESSOR_SHA }}
          path: predecessor
          fetch-depth: 1

      - name: Checkout exact released Contract A 2.0.0 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_A_SHA }}
          path: contracts
          fetch-depth: 1

      - name: Verify pinned authorities
        run: |
          test "$(git -C predecessor rev-parse HEAD)" = "$PREDECESSOR_SHA"
          test "$(git -C contracts rev-parse HEAD)" = "$CONTRACT_A_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install successor and fetch frozen predecessors
        working-directory: candidate
        run: |
          python scripts/fetch_frozen_predecessors.py
          python -m pip install -e .[dev]

      - name: Fetch frozen predecessor dependencies
        working-directory: predecessor
        run: python scripts/fetch_frozen_predecessors.py

      - name: Reproduce known-defective predecessor
        working-directory: predecessor
        run: |
          PYTHONPATH=src python scripts/run_gate_v1_rc3.py \
            research/gates_v1_rc3/health-canada-001.json \
            --out-dir /tmp/predecessor-html \
            --implementation-identity "$FIXED_IDENTITY"
          test -f /tmp/predecessor-html/CONTRACT-A.json
          PYTHONPATH=src python scripts/verify_gate_bundle_v1_rc3.py \
            --claim-gate /tmp/predecessor-html/CLAIM-GATE.json \
            --evidence-gate /tmp/predecessor-html/EVIDENCE-GATE.json \
            --receipt /tmp/predecessor-html/STANDARDIZATION-RECEIPT.json \
            --contract-a /tmp/predecessor-html/CONTRACT-A.json

      - name: Require predecessor external Contract A rejection
        run: |
          PYTHONPATH=contracts python - <<'PY'
          import json
          from pathlib import Path
          from validators.contract_a import ContractAValidationError, validate_candidate

          value = json.loads(Path("/tmp/predecessor-html/CONTRACT-A.json").read_text())
          try:
              validate_candidate(value)
          except ContractAValidationError as exc:
              if "media_type" not in str(exc):
                  raise SystemExit(f"predecessor failed for unexpected reason: {exc}")
              Path("/tmp/predecessor-control.txt").write_text(
                  "FALSIFIED_GATE_V1_RELEASED_CONTRACT_A_PRODUCER_CONFORMANCE\n"
              )
          else:
              raise SystemExit("known-defective predecessor unexpectedly passed Contract A 2.0")
          PY

      - name: Run successor on unchanged HTML representation
        working-directory: candidate
        run: |
          PYTHONPATH=src python scripts/run_gate_production_slice_v1.py \
            research/gates_v1_rc3/health-canada-001.json \
            --out-dir /tmp/candidate-html \
            --implementation-identity "$FIXED_IDENTITY"
          test ! -e /tmp/candidate-html/CONTRACT-A.json
          PYTHONPATH=src python scripts/verify_gate_bundle_v1_rc3.py \
            --claim-gate /tmp/candidate-html/CLAIM-GATE.json \
            --evidence-gate /tmp/candidate-html/EVIDENCE-GATE.json \
            --receipt /tmp/candidate-html/STANDARDIZATION-RECEIPT.json

      - name: Check fail-closed boundary and EvidenceGate preservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          claim = json.loads(Path("/tmp/candidate-html/CLAIM-GATE.json").read_text())
          evidence = json.loads(Path("/tmp/candidate-html/EVIDENCE-GATE.json").read_text())
          receipt = json.loads(Path("/tmp/candidate-html/STANDARDIZATION-RECEIPT.json").read_text())

          assert claim["authoring"] == {
              "state": "FAILED",
              "reason": "CONTRACT_A_SOURCE_REPRESENTATION_UNSUPPORTED",
          }
          assert claim["contract_a_binding"] == {
              "state": "absent",
              "handoff_sha256": None,
          }
          assert receipt["contract_a_state"] == "absent"
          assert receipt["contract_a_handoff_sha256"] is None
          assert receipt["downstream_authority"]["evidence_bundler_may_consume_contract_a"] is False
          assert any(row["media_type"] == "text/html" for row in evidence["sources"])
          PY
          cmp /tmp/predecessor-html/EVIDENCE-GATE.json /tmp/candidate-html/EVIDENCE-GATE.json
          cmp /tmp/predecessor-html/CLAIM-GATE-INPUT.json /tmp/candidate-html/CLAIM-GATE-INPUT.json
          cmp /tmp/predecessor-html/EVIDENCE-GATE-INPUT.json /tmp/candidate-html/EVIDENCE-GATE-INPUT.json

      - name: Build exact Contract A positive controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(
              Path("candidate/research/gates_v1_rc3/health-canada-001.json").read_text()
          )
          for label, media_type in (
              ("plain", "text/plain; charset=utf-8"),
              ("markdown", "text/markdown; charset=utf-8"),
          ):
              packet = json.loads(json.dumps(source))
              for row in packet["request"]["sources"]:
                  row["media_type"] = media_type
              packet["request"]["handoff_id"] += f"-{label}"
              packet["request"]["work_id"] += f"-{label}"
              Path(f"/tmp/{label}.json").write_text(
                  json.dumps(packet, indent=2, sort_keys=True) + "\n"
              )
          PY

      - name: Require valid-path byte identity and external acceptance
        run: |
          for label in plain markdown; do
            (cd predecessor && PYTHONPATH=src python scripts/run_gate_v1_rc3.py \
              "/tmp/$label.json" \
              --out-dir "/tmp/predecessor-$label" \
              --implementation-identity "$FIXED_IDENTITY")
            (cd candidate && PYTHONPATH=src python scripts/run_gate_production_slice_v1.py \
              "/tmp/$label.json" \
              --out-dir "/tmp/candidate-$label" \
              --implementation-identity "$FIXED_IDENTITY")
            diff -ru "/tmp/predecessor-$label" "/tmp/candidate-$label"
          done
          PYTHONPATH=contracts python - <<'PY'
          import json
          from pathlib import Path
          from validators.contract_a import validate_candidate

          for label in ("plain", "markdown"):
              value = json.loads(
                  Path(f"/tmp/candidate-{label}/CONTRACT-A.json").read_text()
              )
              validate_candidate(value)
          PY

      - name: Require deterministic successor replay
        working-directory: candidate
        run: |
          PYTHONPATH=src python scripts/run_gate_production_slice_v1.py \
            research/gates_v1_rc3/health-canada-001.json \
            --out-dir /tmp/candidate-html-replay \
            --implementation-identity "$FIXED_IDENTITY"
          diff -ru /tmp/candidate-html /tmp/candidate-html-replay

      - name: Run successor and inherited regression tests
        working-directory: candidate
        run: |
          python -m pytest -q
          python -m ruff check src tests scripts

      - name: Freeze result
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = {
              "schema": "gate-v1-contract-a-media-boundary-successor-rc1-result",
              "predecessor_sha": "c0da10e2e3b9aada5f66af9859cf27964fd3c5fc",
              "contract_a_authority_sha": "529c92b49a34d5c610618551a8737f019f9fa332",
              "successor_sha": "${{ github.sha }}",
              "predecessor_control": "FALSIFIED_GATE_V1_RELEASED_CONTRACT_A_PRODUCER_CONFORMANCE",
              "unsupported_representation": "FAILED_CLOSED_NO_CONTRACT_A",
              "evidence_gate_representation_preserved": True,
              "plain_positive": "BYTE_IDENTICAL_AND_ACCEPTED",
              "markdown_positive": "BYTE_IDENTICAL_AND_ACCEPTED",
              "deterministic_replay": True,
              "disposition": "SUPPORTED FOR PROMOTION",
          }
          Path("/tmp/RESULT.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-v1-contract-a-media-boundary-successor-rc1
          path: |
            /tmp/RESULT.json
            /tmp/predecessor-control.txt
            /tmp/predecessor-html/
            /tmp/candidate-html/
            /tmp/candidate-html-replay/
            /tmp/predecessor-plain/
            /tmp/candidate-plain/
            /tmp/predecessor-markdown/
            /tmp/candidate-markdown/
            /tmp/plain.json
            /tmp/markdown.json
          if-no-files-found: warn
