name: Research Paired Gates Shadow Batch
on:
  pull_request:
    paths:
      - "src/proposition_authoring/**"
      - "scripts/run_paired_gates_shadow_batch.py"
      - ".github/workflows/research-paired-gates-shadow-batch.yml"
      - "integration/claimgate_v1_candidate/fixtures/**"
  workflow_dispatch:

jobs:
  shadow-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_frozen_predecessors.py
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check src tests scripts
      - run: python scripts/run_paired_gates_shadow_batch.py
      - uses: actions/upload-artifact@v4
        with:
          name: paired-gates-shadow-batch
          path: artifacts/paired-gates-shadow-batch/
          if-no-files-found: error
