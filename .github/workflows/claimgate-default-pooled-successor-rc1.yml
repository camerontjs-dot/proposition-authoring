name: ClaimGate default pooled successor RC1

on:
  pull_request:
    paths:
      - "src/proposition_authoring/engine.py"
      - "integration/claimgate_v1_default_pooled_successor_rc0/**"
      - "integration/claimgate_v1_default_pooled_successor_rc1/**"
      - ".github/workflows/claimgate-default-pooled-successor-rc1.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout exact RC4b authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/proposition-authoring
          ref: 809b2534ffb34efa31c13975da55e65770460b99
          path: authority/rc4b

      - name: Checkout released Contract A 2.0 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 529c92b49a34d5c610618551a8737f019f9fa332
          path: authority/apparatus-a

      - name: Checkout exact Evidence Bundler consumer
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: authority/eb

      - name: Install ClaimGate successor
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python scripts/fetch_frozen_predecessors.py
          .venv/bin/python -m pip check

      - name: Install exact Evidence Bundler consumer
        run: |
          set -euo pipefail
          python -m venv .venv-eb
          .venv-eb/bin/python -m pip install --upgrade pip
          .venv-eb/bin/python -m pip install 'click>=8.1,<9' 'pdfminer.six>=20231228,<20270000' 'pydantic>=2.6,<3' 'pypdf>=4,<7' 'PyYAML>=6,<7' 'rank-bm25>=0.2.2,<0.3'
          .venv-eb/bin/python -m pip install -e authority/eb --no-deps

      - name: Verify exact authority inputs and frozen runtime subject
        run: |
          set -euo pipefail
          test "$(git -C authority/rc4b rev-parse HEAD)" = "809b2534ffb34efa31c13975da55e65770460b99"
          test "$(git -C authority/apparatus-a rev-parse HEAD)" = "529c92b49a34d5c610618551a8737f019f9fa332"
          test "$(git -C authority/eb rev-parse HEAD)" = "4e1f6fe00e7c350b28f52bfea14f1f8988847884"
          test "$(git hash-object src/proposition_authoring/engine.py)" = "42ce4798e960a2f48afa7ab90147cac4fdf5799b"
          git diff --name-only b3278e960707720f5add10935027a7187725d446..HEAD > /tmp/successor-files.txt
          cat /tmp/successor-files.txt
          .venv/bin/python - <<'PY'
          from pathlib import Path
          changed = set(Path('/tmp/successor-files.txt').read_text().splitlines())
          runtime = {p for p in changed if p.startswith('src/')}
          assert runtime == {'src/proposition_authoring/engine.py'}, runtime
          forbidden = {
              'src/proposition_authoring/coverage_backend.py',
              'src/proposition_authoring/coverage_proposers.py',
              'src/proposition_authoring/authority.py',
              'src/proposition_authoring/contract_a.py',
              'src/proposition_authoring/profile.py',
          }
          assert not (changed & forbidden), changed & forbidden
          print('FROZEN_RUNTIME_SUBJECT_PASS')
          PY

      - name: Maintained ClaimGate regression and static gates
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q tests
          .venv/bin/ruff check src tests scripts integration
          .venv/bin/python -m compileall -q src tests scripts integration
          .venv/bin/python -m pip check

      - name: Exact 44-case RC4b default-versus-pooled equivalence and gold preservation
        run: |
          set -euo pipefail
          mkdir -p build
          .venv/bin/python integration/claimgate_v1_default_pooled_successor_rc0/compare_default_to_rc4b.py \
            --cases authority/rc4b/research/rc4b_context_free_reproduction/fresh_cases.jsonl \
            --gold authority/rc4b/research/rc4b_context_free_reproduction/GOLD/fresh_gold.jsonl \
            --out build/rc4b-default-pooled-equivalence.json

      - name: Execute frozen public CLI smoke twice
        run: |
          set -euo pipefail
          BASE=integration/claimgate_v1_candidate/fixtures
          rm -rf build/smoke
          for run in run1 run2; do
            for name in declared not_needed abstained; do
              mkdir -p "build/smoke/$name/$run"
              .venv/bin/proposition-authoring author \
                "$BASE/$name.json" \
                --receipt "build/smoke/$name/$run/receipt.json" \
                --contract-a "build/smoke/$name/$run/contract_a.json" \
                > "build/smoke/$name/$run/stdout.txt"
            done
          done
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          base = Path('build/smoke')
          expectations = json.loads(Path('integration/claimgate_v1_candidate/fixtures/EXPECTATIONS.json').read_text())
          by_fixture = {row['fixture']: row for row in expectations['cases']}
          for name in ('declared','not_needed','abstained'):
              exp = by_fixture[f'{name}.json']
              for run in ('run1','run2'):
                  root = base / name / run
                  receipt = json.loads((root / 'receipt.json').read_text())
                  assert receipt['state'] == exp['expected_authoring_state'], (name, run, receipt['state'])
                  a_path = root / 'contract_a.json'
                  assert a_path.exists() is exp['expected_contract_a'], (name, run, a_path.exists())
                  if name == 'declared':
                      value = json.loads(a_path.read_text())
                      decomp = value['decomposition']
                      assert decomp['state'] == 'declared'
                      assert decomp['operator'] == 'all_of'
                      assert [c['text'] for c in decomp['children']] == exp['expected_children']
                  elif name == 'not_needed':
                      value = json.loads(a_path.read_text())
                      assert value['decomposition']['state'] == 'not_decomposed'
          for name in ('declared','not_needed','abstained'):
              assert (base/name/'run1'/'receipt.json').read_bytes() == (base/name/'run2'/'receipt.json').read_bytes()
              if name != 'abstained':
                  assert (base/name/'run1'/'contract_a.json').read_bytes() == (base/name/'run2'/'contract_a.json').read_bytes()
          print('PUBLIC_CLI_SMOKE_AND_REPLAY_PASS')
          PY

      - name: External Contract A validation
        run: |
          set -euo pipefail
          .venv/bin/python authority/apparatus-a/validators/contract_a_rc2.py build/smoke/declared/run1/contract_a.json
          .venv/bin/python authority/apparatus-a/validators/contract_a_rc2.py build/smoke/not_needed/run1/contract_a.json

      - name: Contract A hostile mutation controls
        run: |
          set -euo pipefail
          mkdir -p build/tamper
          .venv/bin/python - <<'PY'
          import copy, json
          from pathlib import Path
          source = json.loads(Path('build/smoke/declared/run1/contract_a.json').read_text())
          mutations = {}
          value = copy.deepcopy(source); value['root_proposition']['text'] += ' tampered'; mutations['stale-root'] = value
          value = copy.deepcopy(source); value['decomposition']['children'][0]['text'] += ' tampered'; mutations['stale-child'] = value
          value = copy.deepcopy(source); value['handoff_sha256'] = 'sha256:' + '0'*64; mutations['bad-handoff-hash'] = value
          value = copy.deepcopy(source); value['decomposition']['operator'] = 'any_of'; mutations['bad-operator'] = value
          value = copy.deepcopy(source); value['decomposition']['children'] = value['decomposition']['children'][:1]; mutations['removed-child'] = value
          root = Path('build/tamper')
          for name, obj in mutations.items():
              (root/f'{name}.json').write_text(json.dumps(obj, sort_keys=True, indent=2) + '\n')
          PY
          for name in stale-root stale-child bad-handoff-hash bad-operator removed-child; do
            if .venv/bin/python authority/apparatus-a/validators/contract_a_rc2.py "build/tamper/$name.json" >"build/tamper/$name.stdout" 2>"build/tamper/$name.stderr"; then
              echo "UNEXPECTED_VALID_TAMPER=$name"
              exit 1
            fi
          done
          echo CONTRACT_A_HOSTILE_CONTROLS_PASS

      - name: Exact frozen EB consumer conformance and replay
        run: |
          set -euo pipefail
          EB=authority/eb
          RUNNER="$EB/scripts/run_v1_integration_candidate.py"
          CARRIER="$EB/research/eb_v1_integration_candidate/contract_b_compatibility_carrier.json"
          rm -rf build/eb
          for name in declared not_needed; do
            for run in run1 run2; do
              .venv-eb/bin/python "$RUNNER" \
                "build/smoke/$name/run1/contract_a.json" \
                --compatibility-carrier "$CARRIER" \
                --out-dir "build/eb/$name/$run"
            done
          done
          .venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path
          def hashes(root):
              return {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          for name in ('declared','not_needed'):
              a = Path('build/eb')/name/'run1'; b = Path('build/eb')/name/'run2'
              assert hashes(a) == hashes(b), name
          print('EB_REPLAY_PASS')
          PY
          for name in stale-root stale-child; do
            if .venv-eb/bin/python "$RUNNER" \
              "build/tamper/$name.json" \
              --compatibility-carrier "$CARRIER" \
              --out-dir "build/eb/tamper-$name" \
              >"build/eb/tamper-$name.stdout" 2>"build/eb/tamper-$name.stderr"; then
              echo "EB_UNEXPECTEDLY_ACCEPTED_TAMPER=$name"
              exit 1
            fi
          done
          echo EB_CONSUMER_CONFORMANCE_PASS

      - name: Freeze successor qualification receipt
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import hashlib, json, platform, subprocess
          from pathlib import Path
          def sha(path): return 'sha256:' + hashlib.sha256(Path(path).read_bytes()).hexdigest()
          receipt = {
              'schema': 'claimgate-v1-default-pooled-successor-rc1-receipt-v1',
              'classification': 'SUPPORTED_CLAIMGATE_V1_DEFAULT_POOLED_SUCCESSOR_RC1',
              'records_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'runtime_binding_commit': '11f0d23a6a67239a1d3e0627ea542265f4eafbbf',
              'engine_blob': '42ce4798e960a2f48afa7ab90147cac4fdf5799b',
              'predecessor_falsified_head': 'b3278e960707720f5add10935027a7187725d446',
              'rc4b_authority': '809b2534ffb34efa31c13975da55e65770460b99',
              'contract_a_release_commit': '529c92b49a34d5c610618551a8737f019f9fa332',
              'eb_consumer_head': '4e1f6fe00e7c350b28f52bfea14f1f8988847884',
              'runtime_change': 'default AuthoringEngine backend binding only',
              'rc4b_equivalence': json.loads(Path('build/rc4b-default-pooled-equivalence.json').read_text()),
              'frozen_cli_smoke': {'declared':'DECLARED','not_needed':'NOT_NEEDED','abstained':'ABSTAINED'},
              'external_contract_a_validation': 'pass',
              'contract_a_hostile_controls': ['stale-root','stale-child','bad-handoff-hash','bad-operator','removed-child'],
              'eb_consumer_conformance': 'pass',
              'eb_tamper_rejections': ['stale-root','stale-child'],
              'cli_replay': 'byte-identical',
              'eb_replay': 'byte-identical',
              'python': platform.python_version(),
              'artifacts': {
                  'equivalence_sha256': sha('build/rc4b-default-pooled-equivalence.json'),
                  'declared_contract_a_sha256': sha('build/smoke/declared/run1/contract_a.json'),
                  'not_needed_contract_a_sha256': sha('build/smoke/not_needed/run1/contract_a.json'),
              },
              'nonclaims': ['no merge authorization','no release','no semantic widening','no production use','no pipeline prototype freeze by this receipt alone'],
          }
          Path('build/QUALIFICATION_RECEIPT_RC1.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(receipt['classification'])
          PY

      - name: Upload RC1 successor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimgate-default-pooled-successor-rc1
          path: |
            build/QUALIFICATION_RECEIPT_RC1.json
            build/rc4b-default-pooled-equivalence.json
            build/smoke/
            build/tamper/
            build/eb/
          if-no-files-found: warn
