name: Research Claim Profile Evidence Taxonomy
on:
  pull_request:
    paths:
      - "research/claim_profile_evidence_taxonomy_v0/**"
      - "scripts/evaluate_claim_profile_evidence_taxonomy.py"
      - "src/proposition_authoring/claim_profile.py"
      - "src/proposition_authoring/evidence_gate.py"
      - "src/proposition_authoring/preflight.py"
      - ".github/workflows/research-claim-profile-evidence-taxonomy.yml"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_frozen_predecessors.py
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check src tests scripts
      - run: python scripts/evaluate_claim_profile_evidence_taxonomy.py
      - uses: actions/upload-artifact@v4
        with:
          name: claim-profile-evidence-taxonomy-v0
          path: artifacts/claim-profile-evidence-taxonomy-v0/
          if-no-files-found: error
