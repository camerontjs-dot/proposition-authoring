name: Gate V1 RC2 Surface Pressure

on:
  pull_request:
    paths:
      - "research/gates_v1_rc2_surface_pressure/**"
      - ".github/workflows/gates-v1-rc2-surface-pressure.yml"
  workflow_dispatch:

jobs:
  pressure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pressure branch
        uses: actions/checkout@v4
      - name: Verify frozen subject implementation is unchanged
        run: |
          git fetch --no-tags --depth=1 origin 8c10bd703a747f5448c424fbe7ce1e2521b7647e
          git diff --exit-code 8c10bd703a747f5448c424fbe7ce1e2521b7647e -- \
            src/proposition_authoring/gate_v1_rc2.py \
            scripts/run_gate_v1_rc2.py \
            schema/gates/1.0.0-rc.2 \
            docs/GATE_V1_RC2_OUTPUT_CONTRACT.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch frozen predecessors
        run: python scripts/fetch_frozen_predecessors.py
      - name: Install subject and evaluator dependencies
        run: |
          python -m pip install -e .[dev]
          python -m pip install jsonschema
      - name: Static-check evaluator
        run: python -m ruff check research/gates_v1_rc2_surface_pressure/pressure_test.py
      - name: Execute pressure sweep twice
        run: |
          python research/gates_v1_rc2_surface_pressure/pressure_test.py
          cp -r pressure-result /tmp/first
          rm -rf pressure-result
          python research/gates_v1_rc2_surface_pressure/pressure_test.py
          diff -ru /tmp/first pressure-result
      - name: Verify result apparatus shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('pressure-result/RESULT.json').read_text())
          assert result['subject'] == '8c10bd703a747f5448c424fbe7ce1e2521b7647e'
          assert result['case_count'] == len(result['cases'])
          assert result['case_count'] >= 30
          assert sum(result['counts'].values()) == result['case_count']
          assert result['authority_effect'] == 'NONE_PRESSURE_TEST_ONLY'
          print(json.dumps(result['counts'], indent=2, sort_keys=True))
          PY
      - name: Surface scientific result
        run: cat pressure-result/RESULT.md
      - name: Upload pressure artifact
        uses: actions/upload-artifact@v4
        with:
          name: gates-v1-rc2-surface-pressure
          path: pressure-result/
          if-no-files-found: error
