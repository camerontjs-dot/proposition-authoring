name: Research RC3 Safe Coverage Recovery
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "research/rc3_coverage/**"
      - "scripts/fetch_frozen_predecessors.py"
      - "BOOTSTRAP_AUTHORITY.json"
      - ".github/workflows/research-rc3-coverage.yml"

jobs:
  rc3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch exact predecessor authorities
        run: python scripts/fetch_frozen_predecessors.py
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check src tests scripts research/rc3_coverage
      - name: Development and regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests scripts research/rc3_coverage
      - name: Verify freeze if present
        run: |
          if [ -f research/rc3_coverage/FREEZE.json ]; then
            python research/rc3_coverage/verify_freeze.py
          else
            echo "RC3 freeze not present; development phase"
          fi
      - name: Run decisive fresh qualification if sealed
        run: |
          set -euo pipefail
          CASES=research/rc3_coverage/fresh_cases.jsonl
          GOLD=research/rc3_coverage/GOLD/fresh_gold.jsonl
          if [ ! -f "$CASES" ] || [ ! -f "$GOLD" ]; then
            echo "fresh RC3 surface absent; pre-freeze phase"
            exit 0
          fi
          python research/rc3_coverage/verify_freeze.py
          mkdir -p decisive
          mv "$GOLD" /tmp/rc3-fresh-gold.jsonl
          python research/rc3_coverage/run_raw.py --cases "$CASES" --output decisive/raw-a.jsonl
          python research/rc3_coverage/run_raw.py --cases "$CASES" --output decisive/raw-b.jsonl
          cmp decisive/raw-a.jsonl decisive/raw-b.jsonl
          sha256sum decisive/raw-a.jsonl decisive/raw-b.jsonl > decisive/RAW_SHA256SUMS
          mv /tmp/rc3-fresh-gold.jsonl "$GOLD"
          python research/rc3_coverage/score.py \
            --raw decisive/raw-a.jsonl \
            --gold "$GOLD" \
            --validator vendor/frozen/contract_a_rc2.py \
            --output decisive/score.json
          sha256sum "$CASES" "$GOLD" decisive/raw-a.jsonl decisive/score.json > decisive/SHA256SUMS
          cat decisive/score.json
      - name: Upload decisive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposition-authoring-rc3-${{ github.run_id }}
          path: |
            decisive/
            research/rc3_coverage/FREEZE.json
            research/rc3_coverage/FRESH_FREEZE.json
          if-no-files-found: ignore
