name: Promotion - Gate V1 Slice 1 Qualification

on:
  push:
    branches:
      - promotion/gate-v1-slice-1-20260919
  pull_request:
    branches:
      - promotion/main-converge-v1.0.0-20260917
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: a66b23b413bb5e51626c32694261a71c7b69d5ea
      BASE_TREE: 4ea9d0fa5ab9d926e0bf960da2103be8c202d400
      PREDECESSOR_SHA: c0da10e2e3b9aada5f66af9859cf27964fd3c5fc
      CONTRACT_A_SHA: 529c92b49a34d5c610618551a8737f019f9fa332
      EB_SHA: 5b8677ff51b039c2704ce29ee9c8e08bd02e95ca
      FIXED_IDENTITY: gate-v1-slice-1-qualification

    steps:
      - name: Checkout Gate slice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base and bounded slice diff
        run: |
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/promotion-gate-v1-slice-1.yml",
              "docs/promotion/GATE_V1_SLICE_1_20260919.md",
              "docs/promotion/GATE_V1_SLICE_1_MANIFEST.json",
              "scripts/run_gate_production_slice_v1.py",
              "src/proposition_authoring/production_slice.py",
              "tests/test_production_slice.py",
          }
          changed = {
              row
              for row in subprocess.check_output(
                  ["git", "diff", "--name-only", "a66b23b413bb5e51626c32694261a71c7b69d5ea", "HEAD"],
                  text=True,
              ).splitlines()
              if row
          }
          unexpected = sorted(changed - allowed)
          missing = sorted(
              {
                  "scripts/run_gate_production_slice_v1.py",
                  "src/proposition_authoring/production_slice.py",
                  "tests/test_production_slice.py",
              }
              - changed
          )
          if unexpected:
              raise SystemExit(f"unexpected production-slice paths: {unexpected}")
          if missing:
              raise SystemExit(f"missing required production-slice paths: {missing}")
          PY

      - name: Verify qualified runtime blob identity
        run: |
          check_blob() {
            path="$1"
            expected="$2"
            observed="$(git rev-parse "HEAD:$path")"
            test "$observed" = "$expected" || {
              echo "$path drift: expected $expected observed $observed" >&2
              exit 1
            }
          }
          check_blob src/proposition_authoring/production_slice.py 22fc914868cb9da36cfbba77e1c43cd557df46a1
          check_blob scripts/run_gate_production_slice_v1.py f7f2e48ffc61ba676ac1ed7629c5dcbc9e41e1e8
          check_blob tests/test_production_slice.py 79a4e88a37d60a0064512635cb81c03a595b4290
          check_blob src/proposition_authoring/gate_v1_rc3.py 00918633bd83e2b69e083d20c2d4578b797ed9e4
          check_blob src/proposition_authoring/gate_v1.py d5120bd09050f7566b15ddd6347a6fdfbfc01450
          check_blob src/proposition_authoring/contract_a.py c7997d91146a1a7b3e888c98a9ed5f9610ce3f6e

      - name: Checkout exact V1.0.0 predecessor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREDECESSOR_SHA }}
          path: predecessor
          fetch-depth: 1

      - name: Checkout released Contract A 2.0 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_A_SHA }}
          path: contracts
          fetch-depth: 1

      - name: Checkout exact Evidence Bundler next consumer
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: ${{ env.EB_SHA }}
          path: eb
          fetch-depth: 1

      - name: Verify downstream consumer runtime pins
        run: |
          test "$(git -C eb rev-parse HEAD)" = "$EB_SHA"
          test "$(git -C eb rev-parse HEAD:scripts/run_v1_integration_candidate.py)" = d756f98ad410a2491be89bb73bbb9c7963724e50
          test "$(git -C eb rev-parse HEAD:src/evidence_bundler/v1/contract_a.py)" = 5799750389b1fbe8ec2da58af371242c161f6e13
          test "$(git -C eb rev-parse HEAD:src/evidence_bundler/v1/builder.py)" = b64416c222c03b5ce472275d86f801beff7e7380
          test "$(git -C eb rev-parse HEAD:config/eb_v1_slice/contract_b_compatibility_carrier.json)" = ddb16cd58baed833adfc4e81d7aef3745a5900f3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare exact runtimes
        run: |
          python scripts/fetch_frozen_predecessors.py
          (cd predecessor && python scripts/fetch_frozen_predecessors.py)
          python -m pip install -e .[dev]
          python -m pip install -e ./eb

      - name: Run maintained Gate quality gates
        run: |
          python -m pytest -q
          python -m ruff check src tests scripts

      - name: Build exact positive controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(
              Path("research/gates_v1_rc3/health-canada-001.json").read_text()
          )
          for label, media_type in (
              ("plain", "text/plain; charset=utf-8"),
              ("markdown", "text/markdown; charset=utf-8"),
          ):
              packet = json.loads(json.dumps(source))
              for row in packet["request"]["sources"]:
                  row["media_type"] = media_type
              packet["request"]["handoff_id"] += f"-slice-{label}"
              packet["request"]["work_id"] += f"-slice-{label}"
              Path(f"/tmp/{label}.json").write_text(
                  json.dumps(packet, indent=2, sort_keys=True) + "\n"
              )
          PY

      - name: Require exact V1 byte identity on valid paths
        run: |
          for label in plain markdown; do
            (cd predecessor && PYTHONPATH=src python scripts/run_gate_v1_rc3.py \
              "/tmp/$label.json" \
              --out-dir "/tmp/predecessor-$label" \
              --implementation-identity "$FIXED_IDENTITY")
            PYTHONPATH=src python scripts/run_gate_production_slice_v1.py \
              "/tmp/$label.json" \
              --out-dir "/tmp/candidate-$label" \
              --implementation-identity "$FIXED_IDENTITY"
            diff -ru "/tmp/predecessor-$label" "/tmp/candidate-$label"
          done

      - name: Require exact released Contract A acceptance
        run: |
          PYTHONPATH=contracts python - <<'PY'
          import json
          from pathlib import Path
          from validators.contract_a import validate_candidate

          for label in ("plain", "markdown"):
              validate_candidate(
                  json.loads(Path(f"/tmp/candidate-{label}/CONTRACT-A.json").read_text())
              )
          PY

      - name: Require deterministic unsupported-representation fail-closed behavior
        run: |
          PYTHONPATH=src python scripts/run_gate_production_slice_v1.py \
            research/gates_v1_rc3/health-canada-001.json \
            --out-dir /tmp/candidate-html \
            --implementation-identity "$FIXED_IDENTITY"
          PYTHONPATH=src python scripts/run_gate_production_slice_v1.py \
            research/gates_v1_rc3/health-canada-001.json \
            --out-dir /tmp/candidate-html-replay \
            --implementation-identity "$FIXED_IDENTITY"
          diff -ru /tmp/candidate-html /tmp/candidate-html-replay
          test ! -e /tmp/candidate-html/CONTRACT-A.json
          python - <<'PY'
          import json
          from pathlib import Path

          claim = json.loads(Path("/tmp/candidate-html/CLAIM-GATE.json").read_text())
          evidence = json.loads(Path("/tmp/candidate-html/EVIDENCE-GATE.json").read_text())
          receipt = json.loads(Path("/tmp/candidate-html/STANDARDIZATION-RECEIPT.json").read_text())

          assert claim["authoring"] == {
              "state": "FAILED",
              "reason": "CONTRACT_A_SOURCE_REPRESENTATION_UNSUPPORTED",
          }
          assert claim["contract_a_binding"] == {"state": "absent", "handoff_sha256": None}
          assert receipt["contract_a_state"] == "absent"
          assert receipt["contract_a_handoff_sha256"] is None
          assert receipt["downstream_authority"]["evidence_bundler_may_consume_contract_a"] is False
          assert any(row["media_type"] == "text/html" for row in evidence["sources"])
          PY

      - name: Require exact EB next-consumer acceptance
        run: |
          (cd eb && PYTHONPATH=src python scripts/run_v1_integration_candidate.py \
            /tmp/candidate-plain/CONTRACT-A.json \
            --compatibility-carrier config/eb_v1_slice/contract_b_compatibility_carrier.json \
            --out-dir /tmp/eb-valid)
          test -f /tmp/eb-valid/native_eb_v1_package.json
          test -f /tmp/eb-valid/projection_receipt.json
          test -d /tmp/eb-valid/contract_b

      - name: Require hostile V1.0.0 HTML Contract A rejection by EB
        run: |
          (cd predecessor && PYTHONPATH=src python scripts/run_gate_v1_rc3.py \
            research/gates_v1_rc3/health-canada-001.json \
            --out-dir /tmp/predecessor-html \
            --implementation-identity "$FIXED_IDENTITY")
          test -f /tmp/predecessor-html/CONTRACT-A.json
          set +e
          (
            cd eb
            PYTHONPATH=src python scripts/run_v1_integration_candidate.py \
              /tmp/predecessor-html/CONTRACT-A.json \
              --compatibility-carrier config/eb_v1_slice/contract_b_compatibility_carrier.json \
              --out-dir /tmp/eb-hostile
          ) >/tmp/eb-hostile.stdout 2>/tmp/eb-hostile.stderr
          rc=$?
          set -e
          test "$rc" -ne 0
          test ! -e /tmp/eb-hostile/native_eb_v1_package.json
          grep -q "media_type" /tmp/eb-hostile.stderr

      - name: Freeze qualification result
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          result = {
              "schema": "gate-v1-production-slice-1-qualification-result",
              "slice_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "base_sha": "a66b23b413bb5e51626c32694261a71c7b69d5ea",
              "research_authority": "c3d04eadfc74c6614836533c24476252e3dd74f6",
              "contract_a_authority": "529c92b49a34d5c610618551a8737f019f9fa332",
              "eb_consumer": "5b8677ff51b039c2704ce29ee9c8e08bd02e95ca",
              "valid_v1_paths": "BYTE_IDENTICAL",
              "released_contract_a": "ACCEPTED_VALID_PATHS",
              "unsupported_representation": "FAILED_CLOSED_NO_CONTRACT_A",
              "deterministic_replay": True,
              "eb_valid_path": "ACCEPTED",
              "hostile_predecessor_contract_a": "REJECTED",
              "disposition": "QUALIFIED_FOR_LOCAL_PIPELINE_RUNS",
          }
          Path("/tmp/RESULT.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Archive portable qualification evidence
        if: always()
        run: |
          tar -C /tmp -czf /tmp/gate-v1-slice-1-qualification-trees.tar.gz \
            predecessor-plain \
            candidate-plain \
            predecessor-markdown \
            candidate-markdown \
            candidate-html \
            candidate-html-replay \
            eb-valid \
            predecessor-html

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-v1-slice-1-qualification
          path: |
            /tmp/RESULT.json
            /tmp/plain.json
            /tmp/markdown.json
            /tmp/gate-v1-slice-1-qualification-trees.tar.gz
            /tmp/eb-hostile.stdout
            /tmp/eb-hostile.stderr
          if-no-files-found: error
