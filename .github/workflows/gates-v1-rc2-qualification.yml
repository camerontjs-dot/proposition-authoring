name: Gate V1 RC2 Qualification

on:
  pull_request:
    paths:
      - "src/proposition_authoring/gate_v1_rc2.py"
      - "scripts/run_gate_v1_rc2.py"
      - "tests/test_gate_v1_rc2.py"
      - "schema/gates/1.0.0-rc.2/**"
      - "docs/GATE_V1_RC2_OUTPUT_CONTRACT.md"
      - "research/gates_v1_rc2/**"
      - ".github/workflows/gates-v1-rc2-qualification.yml"

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch frozen predecessors
        run: python scripts/fetch_frozen_predecessors.py
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Static and focused tests
        run: |
          python -m ruff check src/proposition_authoring/gate_v1_rc2.py scripts/run_gate_v1_rc2.py tests/test_gate_v1_rc2.py
          python -m unittest discover -s tests -p 'test_gate_v1_rc2.py' -v
      - name: Run real Health Canada case
        run: |
          python scripts/run_gate_v1_rc2.py research/gates_v1_rc2/health-canada-001.json --out-dir /tmp/primary --implementation-identity "$(git rev-parse HEAD)"
      - name: Run claim-only control over identical evidence world
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/gates_v1_rc2/health-canada-001.json').read_text())
          p['request']['handoff_id']='real-health-canada-ozempic-001-rc2-control'
          p['request']['work_id']='health-canada-dpd-ozempic-control'
          p['request']['root_id']='claim-ozempic-approved-canada-control'
          p['request']['root_text']='Ozempic is approved in Canada.'
          Path('/tmp/control.json').write_text(json.dumps(p, indent=2, sort_keys=True)+'\n')
          PY
          python scripts/run_gate_v1_rc2.py /tmp/control.json --out-dir /tmp/control --implementation-identity "$(git rev-parse HEAD)"
      - name: Validate real outputs against frozen RC2 schemas
        run: |
          python -m pip install jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          cases = [
              ('/tmp/primary/CLAIM-GATE.json', 'schema/gates/1.0.0-rc.2/claim-gate-output.schema.json'),
              ('/tmp/primary/EVIDENCE-GATE.json', 'schema/gates/1.0.0-rc.2/evidence-gate-output.schema.json'),
              ('/tmp/primary/STANDARDIZATION-RECEIPT.json', 'schema/gates/1.0.0-rc.2/standardization-receipt.schema.json'),
              ('/tmp/control/CLAIM-GATE.json', 'schema/gates/1.0.0-rc.2/claim-gate-output.schema.json'),
              ('/tmp/control/EVIDENCE-GATE.json', 'schema/gates/1.0.0-rc.2/evidence-gate-output.schema.json'),
              ('/tmp/control/STANDARDIZATION-RECEIPT.json', 'schema/gates/1.0.0-rc.2/standardization-receipt.schema.json'),
          ]
          for doc_path, schema_path in cases:
              document=json.loads(Path(doc_path).read_text())
              schema=json.loads(Path(schema_path).read_text())
              Draft202012Validator(schema).validate(document)
              print('validated', doc_path)
          PY
      - name: Assert repaired boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path('/tmp/primary'); b=Path('/tmp/control')
          ca=json.loads((a/'CLAIM-GATE.json').read_text())
          ea=json.loads((a/'EVIDENCE-GATE.json').read_text())
          eb=json.loads((b/'EVIDENCE-GATE.json').read_text())
          ra=json.loads((a/'STANDARDIZATION-RECEIPT.json').read_text())
          rb=json.loads((b/'STANDARDIZATION-RECEIPT.json').read_text())
          assert ca['claim']['categories']['values'] == ['status'], ca['claim']['categories']
          assert 'root_id' not in ea
          assert ea == eb
          assert ea['evidence_world_id'] == eb['evidence_world_id']
          assert ra['root_id'] != rb['root_id']
          assert ra['evidence_world_id'] == rb['evidence_world_id']
          origin=ea['sources'][0]['provenance']['origin']
          assert origin['origin_type']['value'] == 'official_regulatory_database'
          assert origin['source_uri']['value'].startswith('https://')
          assert (a/'CLAIM-GATE-INPUT.json').exists()
          assert (a/'EVIDENCE-GATE-INPUT.json').exists()
          print(json.dumps({
            'categories': ca['claim']['categories']['values'],
            'evidence_world_id': ea['evidence_world_id'],
            'primary_receipt': ra['receipt_sha256'],
            'control_receipt': rb['receipt_sha256']
          }, indent=2, sort_keys=True))
          PY
      - name: Freeze qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: gates-v1-rc2-health-canada-qualification
          path: |
            /tmp/primary/
            /tmp/control/
          if-no-files-found: error
