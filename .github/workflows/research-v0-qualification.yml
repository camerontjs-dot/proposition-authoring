name: Research - Proposition Authoring V0 Qualification
on:
  pull_request:
    paths:
      - "src/**"
      - "research/v0_qualification/**"
      - "scripts/fetch_frozen_predecessors.py"
      - "BOOTSTRAP_AUTHORITY.json"
      - ".github/workflows/research-v0-qualification.yml"

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record checkout identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Bootstrap exact predecessors
        run: python scripts/fetch_frozen_predecessors.py
      - name: Install development tools
        run: python -m pip install -e .[dev]
      - name: Maintained tests and lint
        run: |
          python -m ruff check src tests scripts research/v0_qualification
          python -m unittest discover -s tests -v
          python -m compileall -q src tests scripts research/v0_qualification
      - name: Verify scientific freeze if present
        run: |
          if [ -f research/v0_qualification/FREEZE.json ]; then
            python research/v0_qualification/verify_freeze.py --manifest research/v0_qualification/FREEZE.json
          else
            echo "freeze manifest not present yet; development phase"
          fi
      - name: Decisive execution if fresh surface is present
        run: |
          set -euo pipefail
          CASES=research/v0_qualification/fresh_cases.jsonl
          GOLD=research/v0_qualification/GOLD/fresh_gold.jsonl
          if [ ! -f "$CASES" ] || [ ! -f "$GOLD" ]; then
            echo "fresh decisive surface not present; development/freeze phase"
            exit 0
          fi
          test -f research/v0_qualification/FREEZE.json
          python research/v0_qualification/verify_freeze.py --manifest research/v0_qualification/FREEZE.json
          mkdir -p decisive
          mv "$GOLD" /tmp/pa-v0-fresh-gold.jsonl
          python research/v0_qualification/run_raw.py --cases "$CASES" --output decisive/raw-a.jsonl
          python research/v0_qualification/run_raw.py --cases "$CASES" --output decisive/raw-b.jsonl
          cmp decisive/raw-a.jsonl decisive/raw-b.jsonl
          sha256sum decisive/raw-a.jsonl decisive/raw-b.jsonl > decisive/RAW_SHA256SUMS
          mv /tmp/pa-v0-fresh-gold.jsonl "$GOLD"
          python research/v0_qualification/score.py \
            --raw decisive/raw-a.jsonl \
            --gold "$GOLD" \
            --validator vendor/frozen/contract_a_rc2.py \
            --output decisive/score.json
          sha256sum "$CASES" "$GOLD" decisive/raw-a.jsonl decisive/score.json > decisive/SHA256SUMS
          cat decisive/score.json
      - name: Upload decisive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposition-authoring-v0-${{ github.run_id }}
          path: |
            decisive/
            research/v0_qualification/FREEZE.json
          if-no-files-found: ignore
