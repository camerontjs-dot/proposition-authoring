name: Gate V1 1.0.0 Release Freeze

on:
  pull_request:
    paths:
      - "src/proposition_authoring/gate_v1_rc3.py"
      - "src/proposition_authoring/__init__.py"
      - "pyproject.toml"
      - "schema/gates/1.0.0/**"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/GATE_V1_1_0_0.md"
      - ".github/workflows/gates-v1-release-freeze.yml"

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Fetch frozen qualified predecessor
        run: git fetch --no-tags origin f02b752ee1f67ea7080771079e5b11c8c248776f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify bounded release diff
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/gates-v1-release-freeze.yml",
              "CHANGELOG.md",
              "README.md",
              "docs/GATE_V1_1_0_0.md",
              "pyproject.toml",
              "schema/gates/1.0.0/claim-gate-output.schema.json",
              "schema/gates/1.0.0/evidence-gate-output.schema.json",
              "schema/gates/1.0.0/standardization-receipt.schema.json",
              "src/proposition_authoring/__init__.py",
              "src/proposition_authoring/gate_v1_rc3.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only",
               "f02b752ee1f67ea7080771079e5b11c8c248776f", "HEAD"],
              text=True,
          ).splitlines())
          unexpected = sorted(changed - allowed)
          assert not unexpected, f"unexpected release-tree changes: {unexpected}"
          print("\n".join(sorted(changed)))
          PY
      - name: Verify implementation change is version-only
        run: |
          git show f02b752ee1f67ea7080771079e5b11c8c248776f:src/proposition_authoring/gate_v1_rc3.py \
            | sed 's/GATE_V1_RC3_VERSION = "1.0.0-rc.3"/GATE_V1_RC3_VERSION = "1.0.0"/' \
            > /tmp/expected_gate_v1.py
          diff -u /tmp/expected_gate_v1.py src/proposition_authoring/gate_v1_rc3.py
      - name: Verify frozen schemas are qualified RC3 schemas with only version identity changed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in [
              "claim-gate-output.schema.json",
              "evidence-gate-output.schema.json",
              "standardization-receipt.schema.json",
          ]:
              src=json.loads(Path(f"schema/gates/1.0.0-rc.3/{name}").read_text())
              dst=json.loads(Path(f"schema/gates/1.0.0/{name}").read_text())
              src["$id"]=src["$id"].replace("/1.0.0-rc.3/", "/1.0.0/")
              src["properties"]["version"]["const"]="1.0.0"
              assert src == dst, f"1.0.0 schema drift: {name}"
              print("verified", name)
          PY
      - name: Verify version metadata
        run: |
          python - <<'PY'
          import proposition_authoring
          from proposition_authoring.gate_v1_rc3 import GATE_V1_RC3_VERSION
          assert proposition_authoring.__version__ == "1.0.0"
          assert GATE_V1_RC3_VERSION == "1.0.0"
          print("package", proposition_authoring.__version__)
          print("wire", GATE_V1_RC3_VERSION)
          PY
      - name: Fetch frozen predecessors
        run: python scripts/fetch_frozen_predecessors.py
      - name: Install release tree
        run: python -m pip install -e .[dev]
      - name: Run focused V1 tests
        run: |
          python -m ruff check src/proposition_authoring/gate_v1_rc3.py tests/test_gate_v1_rc3.py research/gates_v1_rc3/pressure_replay.py
          python -m unittest discover -s tests -p 'test_gate_v1_rc3.py' -v
      - name: Replay inherited 44-case pressure matrix twice
        run: |
          python research/gates_v1_rc3/pressure_replay.py
          cp -r pressure-result /tmp/pressure-first
          rm -rf pressure-result
          python research/gates_v1_rc3/pressure_replay.py
          diff -ru /tmp/pressure-first pressure-result
      - name: Run real Health Canada specimen
        run: |
          python scripts/run_gate_v1_rc3.py \
            research/gates_v1_rc3/health-canada-001.json \
            --out-dir /tmp/release-specimen \
            --implementation-identity "$(git rev-parse HEAD)"
          python scripts/verify_gate_bundle_v1_rc3.py \
            --claim-gate /tmp/release-specimen/CLAIM-GATE.json \
            --evidence-gate /tmp/release-specimen/EVIDENCE-GATE.json \
            --receipt /tmp/release-specimen/STANDARDIZATION-RECEIPT.json \
            --contract-a /tmp/release-specimen/CONTRACT-A.json
      - name: Verify emitted version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/release-specimen")
          for name in ["CLAIM-GATE.json","EVIDENCE-GATE.json","STANDARDIZATION-RECEIPT.json"]:
              obj=json.loads((root/name).read_text())
              assert obj["version"] == "1.0.0", (name, obj["version"])
              print(name, obj["version"])
          PY
      - name: Freeze release acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: gates-v1-1.0.0-release-freeze
          path: |
            /tmp/release-specimen/
            pressure-result/
          if-no-files-found: error
