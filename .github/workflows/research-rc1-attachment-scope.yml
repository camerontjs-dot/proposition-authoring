name: Research RC1 Attachment Scope
on:
  pull_request:
    paths:
      - "src/proposition_authoring/**"
      - "tests/**"
      - "scripts/fetch_frozen_predecessors.py"
      - "research/rc1_attachment_scope/**"
      - ".github/workflows/research-rc1-attachment-scope.yml"

jobs:
  rc1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch exact predecessor authorities
        run: python scripts/fetch_frozen_predecessors.py
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint scientific and harness code
        run: python -m ruff check src tests scripts research/rc1_attachment_scope
      - name: Run development and regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests scripts research/rc1_attachment_scope
      - name: Verify frozen identities when freeze exists
        shell: bash
        run: |
          if [[ -f research/rc1_attachment_scope/FREEZE.json ]]; then
            python research/rc1_attachment_scope/verify_freeze.py
          else
            echo "RC1 target not frozen yet; development/preflight only"
          fi
      - name: Run decisive fresh qualification if sealed surface exists
        id: decisive
        shell: bash
        run: |
          CASES=research/rc1_attachment_scope/fresh_cases.jsonl
          GOLD=research/rc1_attachment_scope/GOLD/fresh_gold.jsonl
          if [[ ! -f "$CASES" || ! -f "$GOLD" ]]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Fresh decisive surface not present; preflight complete"
            exit 0
          fi
          mkdir -p decisive /tmp/rc1-gold
          cp "$GOLD" /tmp/rc1-gold/fresh_gold.jsonl
          rm "$GOLD"
          python research/rc1_attachment_scope/run_raw.py --cases "$CASES" --output decisive/raw-a.jsonl
          python research/rc1_attachment_scope/run_raw.py --cases "$CASES" --output decisive/raw-b.jsonl
          cmp decisive/raw-a.jsonl decisive/raw-b.jsonl
          sha256sum decisive/raw-a.jsonl decisive/raw-b.jsonl > decisive/RAW_SHA256SUMS
          mkdir -p "$(dirname "$GOLD")"
          cp /tmp/rc1-gold/fresh_gold.jsonl "$GOLD"
          python research/rc1_attachment_scope/score.py \
            --raw decisive/raw-a.jsonl \
            --gold "$GOLD" \
            --validator vendor/frozen/contract_a_rc2.py \
            --output decisive/score.json
          sha256sum "$CASES" "$GOLD" decisive/raw-a.jsonl decisive/raw-b.jsonl decisive/score.json > decisive/SHA256SUMS
          cat decisive/score.json
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: Upload decisive receipts
        if: steps.decisive.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proposition-authoring-rc1-decisive
          path: decisive/
